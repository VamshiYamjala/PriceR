name: PriceRadar Scheduled Price Monitor

on:
  schedule:
    # Runs every 4 hours: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC
    # Corresponding India Standard Time (IST = UTC + 5:30):
    # 00:00 UTC -> 05:30 IST
    # 04:00 UTC -> 09:30 IST
    # 08:00 UTC -> 13:30 IST
    # 12:00 UTC -> 17:30 IST
    # 16:00 UTC -> 21:30 IST
    # 20:00 UTC -> 01:30 IST
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions dashboard

jobs:
  trigger-monitor:
    name: Trigger Price Refresh Cycle
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Monitor Endpoint and Poll Run Outcome
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_TRIGGER_SECRET }}
        run: |
          set -e

          if [ -z "$BACKEND_URL" ]; then
            echo "::error::Required secret BACKEND_URL is not configured in GitHub repository secrets."
            exit 1
          fi

          if [ -z "$MONITOR_SECRET" ]; then
            echo "::error::Required secret MONITOR_TRIGGER_SECRET is not configured in GitHub repository secrets."
            exit 1
          fi

          # Strip any trailing slash from BACKEND_URL
          BASE_URL="${BACKEND_URL%/}"
          TRIGGER_URL="${BASE_URL}/api/monitor/run"

          echo "Pinging backend health endpoint to wake sleeping instances: ${BASE_URL}/api/health"
          curl -s -S -o /dev/null \
            --retry 5 \
            --retry-delay 5 \
            --retry-connrefused \
            --max-time 45 \
            "${BASE_URL}/api/health" || echo "Wakeup ping completed or timed out; proceeding to trigger."

          echo "Triggering price monitor endpoint: ${TRIGGER_URL}"
          echo "Using bounded retries to accommodate Render free-tier cold starts..."

          # Curl with bounded retries for sleeping Render free instances
          HTTP_CODE=$(curl -s -S -o trigger_response.json -w "%{http_code}" \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            --max-time 60 \
            -X POST "$TRIGGER_URL" \
            -H "X-Monitor-Secret: $MONITOR_SECRET" \
            -H "Content-Type: application/json" || echo "000")

          echo "Trigger HTTP Status Code: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 202 ]; then
            echo "::error::Price monitor trigger did not return HTTP 202 Accepted. Status: $HTTP_CODE"
            if [ -f trigger_response.json ]; then
              echo "Server Error Response:"
              cat trigger_response.json
              echo ""
            fi
            exit 1
          fi

          RUN_ID=$(node -e "try { const d = JSON.parse(require('fs').readFileSync('trigger_response.json', 'utf8')); console.log(d.data?.runId || ''); } catch { console.log(''); }")

          if [ -z "$RUN_ID" ]; then
            echo "::error::Did not receive valid runId in trigger response."
            cat trigger_response.json
            echo ""
            exit 1
          fi

          echo "✅ Price monitoring cycle accepted by backend."
          echo "Monitoring Run ID: ${RUN_ID}"
          echo "Polling run-specific status at: ${BASE_URL}/api/monitor/runs/${RUN_ID}"

          # Bounded poll loop: check status every 10s for up to 180s
          MAX_POLL_SECS=180
          POLL_INTERVAL=10
          ELAPSED=0
          FINAL_STATUS="in_progress"

          while [ $ELAPSED -lt $MAX_POLL_SECS ]; do
            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))

            POLL_CODE=$(curl -s -S -o status_response.json -w "%{http_code}" \
              --max-time 20 \
              -H "X-Monitor-Secret: $MONITOR_SECRET" \
              "${BASE_URL}/api/monitor/runs/${RUN_ID}" || echo "000")

            if [ "$POLL_CODE" -ne 200 ]; then
              echo "Status check returned HTTP $POLL_CODE (elapsed: ${ELAPSED}s). Retrying..."
              continue
            fi

            CURRENT_STATUS=$(node -e "try { const d = JSON.parse(require('fs').readFileSync('status_response.json', 'utf8')); console.log(d.data?.status || 'unknown'); } catch { console.log('unknown'); }")

            if [ "$CURRENT_STATUS" = "completed" ] || [ "$CURRENT_STATUS" = "failed" ] || [ "$CURRENT_STATUS" = "interrupted" ]; then
              FINAL_STATUS="$CURRENT_STATUS"
              break
            else
              echo "Monitoring cycle is in progress... (elapsed: ${ELAPSED}s)"
            fi
          done

          echo ""
          echo "=========================================================="
          echo "Final Monitoring Outcome for Run: ${RUN_ID}"
          echo "Status: ${FINAL_STATUS}"

          if [ "$FINAL_STATUS" = "completed" ]; then
            node -e "
              const fs = require('fs');
              const d = JSON.parse(fs.readFileSync('status_response.json', 'utf8')).data;
              console.log('Duration: ' + (d.durationMs ? (d.durationMs / 1000).toFixed(1) + 's' : 'N/A'));
              console.log('Offers Attempted: ' + d.offersAttempted);
              console.log('Offers Refreshed Successfully: ' + d.offersSuccessful);
              console.log('Offers Failed: ' + d.offersFailed);
              console.log('Triggered Alerts: ' + d.triggeredAlerts);
              if (d.errors && d.errors.length > 0) {
                console.log('Sanitized Errors:');
                d.errors.forEach((err, idx) => {
                  console.log('  ' + (idx + 1) + '. Provider: ' + (err.provider || 'unknown') + ' | Error: ' + err.message);
                });
              }
            "
            echo "=========================================================="
            ATTEMPTED_COUNT=$(node -e "try { const d = JSON.parse(require('fs').readFileSync('status_response.json', 'utf8')).data; console.log(d.offersAttempted || 0); } catch { console.log(0); }")
            SUCCESS_COUNT=$(node -e "try { const d = JSON.parse(require('fs').readFileSync('status_response.json', 'utf8')).data; console.log(d.offersSuccessful || 0); } catch { console.log(0); }")
            ERRORS_COUNT=$(node -e "try { const d = JSON.parse(require('fs').readFileSync('status_response.json', 'utf8')).data; console.log(d.offersFailed || 0); } catch { console.log(0); }")

            if [ "$ATTEMPTED_COUNT" -gt 0 ] && [ "$SUCCESS_COUNT" -eq 0 ]; then
              echo "::error::All $ATTEMPTED_COUNT tracked offer refresh(es) failed during this monitoring cycle. Check provider credentials."
              exit 1
            elif [ "$ERRORS_COUNT" -gt 0 ]; then
              echo "::warning::$ERRORS_COUNT of $ATTEMPTED_COUNT offer refresh(es) encountered errors during this cycle."
              exit 0
            else
              echo "✅ All tracked offers refreshed successfully."
              exit 0
            fi

          elif [ "$FINAL_STATUS" = "failed" ]; then
            FAILURE_REASON=$(node -e "try { const d = JSON.parse(require('fs').readFileSync('status_response.json', 'utf8')).data; console.log(d.failureReason || 'Unknown failure'); } catch { console.log('Unknown failure'); }")
            echo "Failure Reason: ${FAILURE_REASON}"
            echo "=========================================================="
            echo "::error::Monitoring cycle failed on server: ${FAILURE_REASON}"
            exit 1

          elif [ "$FINAL_STATUS" = "interrupted" ]; then
            echo "=========================================================="
            echo "::error::Monitoring cycle was interrupted by a server restart or timeout."
            exit 1

          else
            echo "=========================================================="
            echo "::warning::Monitoring cycle is still running in the background after ${MAX_POLL_SECS}s."
            echo "Result is inconclusive: the background scrape was accepted (Run ID: ${RUN_ID}), but has not completed within the polling window."
            echo "Do NOT assume prices refreshed successfully."
            echo "Inspect the run outcome later using:"
            echo "curl -H 'X-Monitor-Secret: [SECRET]' '${BASE_URL}/api/monitor/runs/${RUN_ID}'"
            exit 0
          fi
